name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the React dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci && npm run build

      # Assemble _site: root files + dashboard/dist
      - run: |
          mkdir -p _site/dashboard
          cp -r client.html index.html scoring-engine.js scoring-data.js client-reflections.js google-apps-script.js docs README.md CLAUDE.md _site/ 2>/dev/null || true
          cp -r dashboard/dist/* _site/dashboard/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
